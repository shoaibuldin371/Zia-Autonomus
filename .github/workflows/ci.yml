name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pre-commit Secrets Scan
        run: npm run secret-scan

      - name: ESLint
        run: npm run lint

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Vitest Unit Tests
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-service-key' }}
          ADMIN_EMAIL: ziauldin371@gmail.com
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'mock-password-12345' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'mock-session-secret-at-least-32-characters-long' }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET || '0123456789012345678901234567890123456789012345678901234567890123' }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET || 'mock-unsub-secret-at-least-32-characters-long' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'mock-cron-secret' }}
